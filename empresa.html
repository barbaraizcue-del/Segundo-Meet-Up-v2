<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Empresa — Meet Up Sercotec 2026</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .email-match { border-color: #27ae60 !important; background: #f0fff4; }
        .email-nomatch { border-color: #e74c3c !important; background: #fff5f5; }
        .msg-ok { color: #27ae60; font-size: 12px; margin-top: 5px; }
        .msg-err { color: #e74c3c; font-size: 12px; margin-top: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-icon">🏢</div>
            <div>
                <h1>Portal Empresa</h1>
                <p>Meet Up — Sercotec 2026</p>
            </div>
        </div>
        <div class="card">
            <h2>Registrar Disponibilidad</h2>

            <div class="form-group">
                <label>Selecciona tu Empresa:</label>
                <select id="empresa-select" onchange="onEmpresaChange()">
                    <option value="">-- Selecciona una empresa --</option>
                </select>
            </div>

            <div class="form-group">
                <label>Correo de Contacto:</label>
                <input type="email" id="empresa-email" placeholder="correo@empresa.com">
            </div>

            <div class="form-group">
                <label>Confirma tu Correo: <span style="color:#c0392b">*obligatorio</span></label>
                <input type="email" id="empresa-email2" placeholder="Repite tu correo aquí" oninput="chkEmail()">
                <p id="empresa-email-msg" style="font-size:12px; margin-top:5px;"></p>
            </div>

            <div id="disponibilidad-previa" style="display:none;" class="info-box">
                <strong>ℹ️ Ya tienes disponibilidad registrada.</strong> Si guardas de nuevo, se reemplazará.
            </div>

            <div id="empresa-fechas-container" style="display:none;">
                <h3>Selecciona tus horarios disponibles:</h3>
                <p style="font-size:13px; color:#777; margin-bottom:15px;">Haz click en cada horario en que puedes reunirte.</p>
                <div id="empresa-fechas"></div>
                <button class="btn btn-primary" onclick="guardarDisponibilidad()">💾 GUARDAR DISPONIBILIDAD</button>
            </div>

            <div id="empresa-mensaje" class="mensaje"></div>
        </div>
        <div style="text-align:center; margin-top:10px;">
            <a href="index.html" style="color:#999; font-size:13px; text-decoration:none;">← Volver al inicio</a>
        </div>
    </div>

    <script>
        function chkEmail() {
            const e1 = document.getElementById('empresa-email').value.trim();
            const e2 = document.getElementById('empresa-email2').value.trim();
            const msg = document.getElementById('empresa-email-msg');
            const inp = document.getElementById('empresa-email2');
            if (!e2) { inp.className = ''; msg.textContent = ''; return; }
            if (e1 === e2) {
                inp.className = 'email-match';
                msg.className = 'msg-ok';
                msg.textContent = '✅ Los correos coinciden';
            } else {
                inp.className = 'email-nomatch';
                msg.className = 'msg-err';
                msg.textContent = '❌ Los correos no coinciden';
            }
        }
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const app = initializeApp({
            apiKey: "AIzaSyBjWa9R8vFPb9uWZ8sf7_ZIOkq5HOidXOQ",
            authDomain: "segundo-meet-up.firebaseapp.com",
            projectId: "segundo-meet-up",
            storageBucket: "segundo-meet-up.firebasestorage.app",
            messagingSenderId: "272487400395",
            appId: "1:272487400395:web:137a021c570298aab66c4e"
        });
        const db = getFirestore(app);

        const EMPRESAS = [
            "Abastible","Aeropuerto","Aliservice","Andina (Emboteladora y Transporte)",
            "Angloamerican","Antofagasta Minerals","Agrosuper","Aramark",
            "BCI","BHP Chile","Cencosud (Jumbo / Santa Isabel)","CMPC",
            "Cran Chile","Dirección ChileCompra","Empresas Arauco","Enel Chile / Engie",
            "Enex","Lipigas","Local Shop","Mall Plaza",
            "Mercado Libre","Metro","Simón de Cirene","SMU (Unimarc)",
            "Sura","Viña Chocalán","Walmart Chile"
        ];

        const sel = document.getElementById('empresa-select');
        EMPRESAS.forEach(e => { const o = document.createElement('option'); o.value = e; o.textContent = e; sel.appendChild(o); });

        function getFechas() {
            const f = [];
            for (let i = 4; i <= 29; i++) {
                const d = new Date(2026, 10, i);
                if (d.getDay() !== 0 && d.getDay() !== 6) f.push(`2026-11-${String(i).padStart(2,'0')}`);
            }
            return f;
        }

        function getHorarios() {
            const h = [];
            for (let hr = 8; hr <= 17; hr++) {
                for (let m of [0,30]) {
                    if (hr===8 && m===0) continue;
                    if (hr===17 && m===30) continue;
                    h.push(`${String(hr).padStart(2,'0')}:${String(m).padStart(2,'0')}`);
                }
            }
            return h;
        }

        window.onEmpresaChange = async function() {
            const empresa = document.getElementById('empresa-select').value;
            if (!empresa) { document.getElementById('empresa-fechas-container').style.display = 'none'; return; }
            const snap = await getDoc(doc(db, 'disponibilidades', empresa));
            const prev = document.getElementById('disponibilidad-previa');
            const emailInp = document.getElementById('empresa-email');
            const email2Inp = document.getElementById('empresa-email2');
            if (snap.exists()) {
                prev.style.display = 'block';
                emailInp.value = snap.data().email || '';
                email2Inp.value = '';
                document.getElementById('empresa-email-msg').textContent = '';
                email2Inp.className = '';
            } else {
                prev.style.display = 'none';
                emailInp.value = '';
                email2Inp.value = '';
            }
            renderFechas(snap.exists() ? snap.data().horarios || [] : []);
            document.getElementById('empresa-fechas-container').style.display = 'block';
        };

        function renderFechas(sel = []) {
            const cont = document.getElementById('empresa-fechas');
            cont.innerHTML = '';
            getFechas().forEach(fecha => {
                const g = document.createElement('div');
                g.className = 'fecha-grupo';
                const d = new Date(fecha+'T12:00:00');
                g.innerHTML = `<div class="fecha-titulo">📅 ${d.toLocaleDateString('es-CL',{weekday:'long',day:'numeric',month:'long'})}</div>`;
                const hg = document.createElement('div');
                hg.className = 'horarios-grid';
                getHorarios().forEach(hora => {
                    const b = document.createElement('button');
                    b.type = 'button'; b.className = 'horario-btn';
                    b.textContent = hora; b.dataset.fecha = fecha; b.dataset.hora = hora;
                    if (sel.some(h => h.fecha===fecha && h.hora===hora)) b.classList.add('selected');
                    b.onclick = () => b.classList.toggle('selected');
                    hg.appendChild(b);
                });
                g.appendChild(hg); cont.appendChild(g);
            });
        }

        window.guardarDisponibilidad = async function() {
            const empresa = document.getElementById('empresa-select').value;
            const email = document.getElementById('empresa-email').value.trim();
            const email2 = document.getElementById('empresa-email2').value.trim();
            if (!empresa) { msg('empresa-mensaje','❌ Selecciona una empresa',false); return; }
            if (!email) { msg('empresa-mensaje','❌ Ingresa tu correo',false); return; }
            if (!email2) { msg('empresa-mensaje','❌ Debes confirmar tu correo',false); return; }
            if (email !== email2) { msg('empresa-mensaje','❌ Los correos no coinciden',false); return; }
            const btns = document.querySelectorAll('#empresa-fechas .horario-btn.selected');
            if (!btns.length) { msg('empresa-mensaje','❌ Selecciona al menos un horario',false); return; }
            const horarios = [...btns].map(b => ({fecha:b.dataset.fecha, hora:b.dataset.hora}));
            const btn = document.querySelector('.btn-primary');
            btn.disabled = true; btn.textContent = '⏳ Guardando...';
            try {
                await setDoc(doc(db,'disponibilidades',empresa), {empresa, email, horarios, timestamp: new Date().toISOString()});
                msg('empresa-mensaje',`✅ ${empresa} registró ${horarios.length} horarios correctamente.`,true);
            } catch(e) { msg('empresa-mensaje','❌ Error al guardar. Intenta nuevamente.',false); }
            btn.disabled = false; btn.textContent = '💾 GUARDAR DISPONIBILIDAD';
        };

        function msg(id, texto, ok) {
            const d = document.getElementById(id);
            d.className = `mensaje show ${ok?'success':'error'}`;
            d.textContent = texto;
            setTimeout(() => d.classList.remove('show'), 6000);
        }
    </script>
</body>
</html>
